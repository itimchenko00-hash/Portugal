p;align-items:center;gap:9px;margin:28px 0}.step{padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.arrow{color:var(--accent)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:35px}.nav button,.cta{border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer}.next,.cta{background:var(--accent);color:#06131c}.prev{background:transparent;color:var(--text);border:1px solid var(--line)!important}.final{text-align:center;padding:70px 0}.final h2{font-size:clamp(38px,7vw,76px)}.final strong{color:var(--accent2)}.note{font-size:12px;color:var(--muted);margin-top:28px}.hidden{display:none!important}@media(max-width:850px){.menu{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:18px 14px 40px}.top{margin-bottom:18px}.menu,.points{grid-template-columns:1fr}.hero{padding:28px 0}.hero p{font-size:16px}.card{min-height:112px}.content{margin-top:30px}.points{gap:9px}}
